# ==============================================================================
# silicyOS Application Launcher — Fuzzel (Ultra-Light C Wayland Launcher)
# Theme: Apple Industrial Titanium (#0B0B0E, #141418, #26262E, #F2F2F7, #8E8E93, #0A84FF)
# ==============================================================================

[main]
font=JetBrainsMono Nerd Font:size=12:weight=medium
dpi-aware=no
prompt="󰀵  "
placeholder="Spotlight Search..."
icon-theme=Adwaita
icons-enabled=yes
fuzzy=yes
lines=8
width=44
tabs=4
horizontal-pad=20
vertical-pad=16
inner-pad=10
image-size-ratio=0.45
layer=overlay
exit-on-keyboard-focus-loss=yes

[colors]
background=141418f0
text=f2f2f7ff
prompt=0a84ffff
placeholder=8e8e93ff
input=f2f2f7ff
match=0a84ffff
selection=26262eff
selection-text=f2f2f7ff
selection-match=0a84ffff
counter=8e8e93ff
border=26262eff

[border]
width=2
radius=14

[dmenu]
mode=text
exit-immediately-if-empty=no
