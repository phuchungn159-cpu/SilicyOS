# ==============================================================================
# ~/.config/keyd/app.conf — silicyOS Application-Aware Command (⌘) Mapper
# Active with: keyd-application-mapper -d
# Ensures Command (⌘) acts like macOS (Cmd+C/V/X/Z/A/W/T/Q) in all GUI apps and
# browsers, while inside Kitty Terminal Ctrl+C remains POSIX SIGINT and
# Cmd+C / Cmd+V perform clipboard copy/paste.
# ==============================================================================

[*]
# Across all graphical apps & browsers (Firefox, Chromium, GTK4, Qt6, Electron):
# Physical Command (⌘) maps seamlessly to standard desktop shortcuts
# Note: meta.f / meta.r / meta.l are intentionally preserved for Niri/Hyprland
# compositor navigation & layout controls (Mod+F fullscreen, Mod+R column width, Mod+L focus right).
meta.c = C-c
meta.v = C-v
meta.x = C-x
meta.z = C-z
meta.y = C-y
meta.a = C-a
meta.w = C-w
meta.t = C-t
meta.s = C-s
meta.n = C-n
meta.p = C-p
meta.q = M-q

[kitty]
# Inside Kitty (placed after [*] because keyd-application-mapper evaluates blocks top-to-bottom, last wins):
# - Physical Ctrl+C passes through untouched as POSIX interrupt (SIGINT ^C)
# - Physical Command+C / Command+V / Command+T / Command+W trigger terminal actions
# - Physical Command+A / Command+X pass through as Super so kitty.conf handles select_all / copy_and_clear_or_interrupt
# - Physical Command+Z passes through safely as M-z instead of sending POSIX SIGTSTP (^Z)
meta.c = C-S-c
meta.v = C-S-v
meta.t = C-S-t
meta.w = C-S-w
meta.a = M-a
meta.x = M-x
meta.z = M-z

[org-wezfurlong-wezterm]
meta.c = C-S-c
meta.v = C-S-v
meta.t = C-S-t
meta.w = C-S-w
meta.x = M-x
meta.z = M-z
