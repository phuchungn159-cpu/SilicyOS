# ==============================================================================
# silicyOS Optional Compositor — Hyprland (Dynamic Tiling Wayland Compositor)
# Theme: Apple Industrial Titanium (#0B0B0E, #141418, #26262E, #F2F2F7, #8E8E93, #0A84FF)
# Target: Apple Silicon M1/M2/M3
# ==============================================================================

# --- Asahi Mesa AGX Hardware Acceleration & Wayland Environment ---
env = GSK_RENDERER,ngl
env = WLR_RENDERER,vulkan
env = MOZ_ENABLE_WAYLAND,1
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = SDL_VIDEODRIVER,wayland
env = _JAVA_AWT_WM_NONREPARENTING,1
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# --- Apple Retina / ProMotion Display (60Hz/120Hz Adaptive VRR) ---
monitor = eDP-1, preferred, auto, 2
monitor = , preferred, auto, 1

# --- Startup Daemons ---
exec-once = waybar
exec-once = swayosd-server
exec-once = sh -c 'grep -qi "^PC" /etc/silicy-kb-mode 2>/dev/null || exec keyd-application-mapper -d'

# --- Layout & Apple Industrial Titanium Border ---
general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    col.active_border = rgba(0a84ffff) rgba(26262eff) 135deg
    col.inactive_border = rgba(26262eff)
    layout = dwindle
    allow_tearing = false
    resize_on_border = true
}

# --- Concentric 14px Corners, Frosted Blur & Battery-Saving Shadows ---
decoration {
    rounding = 14
    active_opacity = 0.98
    inactive_opacity = 0.92

    shadow {
        enabled = false
    }

    blur {
        enabled = true
        size = 7
        passes = 2
        new_optimizations = true
        xray = true
        ignore_opacity = false
        noise = 0.0117
        contrast = 0.92
        brightness = 0.88
        vibrancy = 0.22
    }
}

# --- 60Hz/120Hz ProMotion Fluid Bezier Curves ---
animations {
    enabled = true
    bezier = appleSpring, 0.22, 1.0, 0.36, 1.0
    bezier = appleOut, 0.16, 1.0, 0.3, 1.0

    animation = windows, 1, 3, appleSpring, popin 86%
    animation = windowsOut, 1, 2, appleOut, popin 90%
    animation = border, 1, 4, default
    animation = fade, 1, 3, appleOut
    animation = workspaces, 1, 4, appleSpring, slide
}

# --- Apple Magic Trackpad & Mac Keyboard Tuning ---
input {
    kb_layout = us
    repeat_rate = 38
    repeat_delay = 220
    follow_mouse = 1
    sensitivity = 0.15

    touchpad {
        natural_scroll = true
        tap-to-click = true
        disable_while_typing = true
        clickfinger_behavior = true
        scroll_factor = 0.82
        drag_lock = false
    }
}

# --- 3-Finger Mac Trackpad Workspace Swipe with Inertia ---
gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
    workspace_swipe_distance = 260
    workspace_swipe_invert = true
    workspace_swipe_min_speed_to_force = 18
    workspace_swipe_cancel_ratio = 0.35
    workspace_swipe_create_new = true
    workspace_swipe_forever = true
}

dwindle {
    pseudotile = true
    preserve_split = true
    force_split = 2
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vfr = true
    vrr = 1
    background_color = 0x0b0b0e
}

# --- Layer Rules for Glassmorphic Waybar, Fuzzel & SwayOSD ---
layerrule = blur, waybar
layerrule = ignorezero, waybar
layerrule = blur, launcher
layerrule = ignorezero, launcher
layerrule = blur, swayosd
layerrule = ignorezero, swayosd

# --- Keybindings (Command ⌘ as SUPER / $mainMod) ---
$mainMod = SUPER

bind = $mainMod, Return, exec, kitty
bind = $mainMod, Space, exec, fuzzel
bind = $mainMod CTRL, Space, exec, silicy-center
bind = $mainMod, slash, exec, silicy-center --shortcuts
bind = $mainMod, Q, killactive,
bind = ALT, F4, killactive,
bind = $mainMod SHIFT, E, exit,
bind = $mainMod SHIFT, V, togglefloating,
bind = $mainMod, F, fullscreen, 1
bind = $mainMod SHIFT, F, fullscreen, 0
bind = $mainMod SHIFT, P, pseudo,
bind = $mainMod SHIFT, T, togglesplit,

# --- Screenshots (macOS Shift+Cmd+4 / Shift+Cmd+3 & Print) ---
bind = , Print, exec, sh -c 'grim -g "$(slurp)" - | wl-copy'
bind = CTRL, Print, exec, sh -c 'grim - | wl-copy'
bind = $mainMod SHIFT, 3, exec, sh -c 'grim - | wl-copy'
bind = $mainMod SHIFT, 4, exec, sh -c 'grim -g "$(slurp)" - | wl-copy'

# --- Apple Hardware Keys (SwayOSD Frosted Glass HUD + speakersafetyd 100% Cap) ---
bindel = , XF86MonBrightnessUp, exec, sh -c 'swayosd-client --brightness +5 || brightnessctl -q set +5%'
bindel = , XF86MonBrightnessDown, exec, sh -c 'swayosd-client --brightness -5 || brightnessctl -q set 5%-'
bindel = , XF86KbdBrightnessUp, exec, sh -c "brightnessctl -d '*kbd_backlight*' -q set +10% && swayosd-client --custom-icon keyboard-brightness-symbolic --custom-message 'Keyboard Backlight +10%'"
bindel = , XF86KbdBrightnessDown, exec, sh -c "brightnessctl -d '*kbd_backlight*' -q set 10%- && swayosd-client --custom-icon keyboard-brightness-symbolic --custom-message 'Keyboard Backlight -10%'"

bindel = , XF86AudioRaiseVolume, exec, sh -c 'swayosd-client --output-volume +5 --max-volume 100 || wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+'
bindel = , XF86AudioLowerVolume, exec, sh -c 'swayosd-client --output-volume -5 --max-volume 100 || wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-'
bindl  = , XF86AudioMute, exec, sh -c 'swayosd-client --output-volume mute-toggle || wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle'
bindl  = , XF86AudioMicMute, exec, sh -c 'swayosd-client --input-volume mute-toggle || wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle'

# --- Focus Navigation ---
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# --- Move Windows ---
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d

# --- Workspaces ---
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6

# --- Mouse Window Manipulation ---
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
