# ==============================================================================
# silicyOS Default Terminal — Kitty (GPU-Accelerated Asahi OpenGL ES / Wayland)
# Theme: Apple Industrial Titanium (#0B0B0E, #141418, #26262E, #F2F2F7, #8E8E93, #0A84FF)
# ==============================================================================

# --- Font Configuration ---
font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic
font_size        12.5
disable_ligatures never

# --- Apple Industrial Titanium Glassmorphism & Window Padding ---
background_opacity         0.76
background_blur            24
dynamic_background_opacity yes
window_padding_width       12 14
placement_strategy         center
hide_window_decorations    yes
confirm_os_window_close    0

# --- Low-RAM Buffer & ProMotion 120Hz Display Tuning ---
scrollback_lines              2000
scrollback_pager_history_size 0
repaint_delay                 8
input_delay                   1
sync_to_monitor               yes
wayland_enable_ime            yes
linux_display_server          wayland

# --- Disable Bell Completely ---
enable_audio_bell no
visual_bell_duration 0.0
window_alert_on_bell no
bell_on_tab ""

# --- Cursor & Mouse ---
cursor_shape          beam
cursor_beam_thickness 1.5
cursor_blink_interval 0
mouse_hide_wait       2.0
copy_on_select        clipboard

# --- macOS Command (⌘) Smart Sync & POSIX Ctrl+C Preservation ---
# Physical Ctrl+C remains untouched as POSIX SIGINT (^C) inside Kitty.
# Both Super (Command ⌘) and Ctrl+Shift bindings (sent by keyd app.conf) perform
# native clipboard and tab management.
map super+c       copy_to_clipboard
map super+v       paste_from_clipboard
map super+x       copy_and_clear_or_interrupt
map super+z       no_op
map super+a       select_all
map super+t       new_tab_with_cwd
map super+w       close_window
map super+q       close_os_window
map ctrl+shift+c  copy_to_clipboard
map ctrl+shift+v  paste_from_clipboard
map ctrl+shift+t  new_tab_with_cwd
map ctrl+shift+w  close_window
map super+equal   change_font_size all +1.0
map super+minus   change_font_size all -1.0
map super+0       change_font_size all 0

# --- Color Palette (Apple Industrial Titanium) ---
foreground              #F2F2F7
background              #0B0B0E
selection_foreground    #F2F2F7
selection_background    #0A84FF
cursor                  #0A84FF
cursor_text_color       #0B0B0E
active_border_color     #0A84FF
inactive_border_color   #26262E
active_tab_foreground   #F2F2F7
active_tab_background   #141418
inactive_tab_foreground #8E8E93
inactive_tab_background #0B0B0E

color0  #0B0B0E
color8  #26262E
color1  #8E8E93
color9  #F2F2F7
color2  #0A84FF
color10 #0A84FF
color3  #8E8E93
color11 #F2F2F7
color4  #0A84FF
color12 #0A84FF
color5  #8E8E93
