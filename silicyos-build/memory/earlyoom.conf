# /etc/default/earlyoom
# silicyOS Unified Memory Protection (CPU + Asahi AGX GPU Shared Memory Pool)
#
# Thresholds:
#   -m 4,2  : Send SIGTERM at <= 4% free RAM, SIGKILL at <= 2% free RAM
#   -s 10,5 : Send SIGTERM at <= 10% free ZRAM swap, SIGKILL at <= 5% free ZRAM swap
#   -r 3600 : Print memory report to journal every hour (reduces log noise)
#   -n      : Enable memory pressure notifications

EARLYOOM_ARGS="-m 4,2 -s 10,5 -r 3600 --avoid '(^|/)(init|systemd|systemd-.*|niri|Hyprland|kitty|greetd|tuigreet|seatd|dbus-broker|iwd|pipewire|wireplumber|speakersafetyd|tiny-dfr|keyd|swayosd-server|swayosd-libinput-backend)$' --prefer '(^|/)(chromium|chrome|firefox|zen-bin|brave|vivaldi|electron|WebKitWebProcess|node|deno|bun|cc1|cc1plus|rustc|rust-analyzer|cargo|ld|ld\.lld|mold|clang|clang\+\+|javac|java|gradle|python3)$'"
