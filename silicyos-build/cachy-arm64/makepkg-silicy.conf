#!/hint/bash
# ==============================================================================
# /etc/makepkg.conf - silicyOS ARM64 (CachyOS-ARM64 Apple Silicon Edition)
# Target: Apple M1/M2/M3 (ARMv8.5-A+ / Firestorm & Icestorm / Avalanche & Blizzard)
# Toolchain: LLVM/Clang + LLD + ThinLTO
# ==============================================================================

# ------------------------------------------------------------------------------
# SOURCE ACQUISITION
# ------------------------------------------------------------------------------
DLAGENTS=('file::/usr/bin/curl -gqC - -o %o %u'
          'ftp::/usr/bin/curl -gqfC - --ftp-pasv --retry 3 --retry-delay 3 -o %o %u'
          'http::/usr/bin/curl -gqb "" -fLC - --retry 3 --retry-delay 3 -o %o %u'
          'https::/usr/bin/curl -gqb "" -fLC - --retry 3 --retry-delay 3 -o %o %u'
          'rsync::/usr/bin/rsync --no-motd -z %u %o'
          'scp::/usr/bin/scp -C %u %o')

VCSCLIENTS=('bzr::breezy'
            'fossil::fossil'
            'git::git'
            'hg::mercurial'
            'svn::subversion')

# ------------------------------------------------------------------------------
# ARCHITECTURE, COMPILE FLAGS & LLVM TOOLCHAIN
# ------------------------------------------------------------------------------
CARCH="aarch64"
CHOST="aarch64-unknown-linux-gnu"

export CC="clang"
export CXX="clang++"
export AR="llvm-ar"
export NM="llvm-nm"
export RANLIB="llvm-ranlib"
export OBJCOPY="llvm-objcopy"
export OBJDUMP="llvm-objdump"
export READELF="llvm-readelf"
export STRIP="llvm-strip"
export LD="ld.lld"

# Mandatory silicyOS Apple Silicon Optimization Flags
CPPFLAGS=""
CFLAGS="-O3 -mcpu=apple-m1 -flto=thin -pipe -fno-plt -fexceptions -Wp,-D_FORTIFY_SOURCE=3"
CXXFLAGS="$CFLAGS"
LDFLAGS="-Wl,-O1 -Wl,--sort-common -Wl,--as-needed -Wl,-z,relro -Wl,-z,now -fuse-ld=lld"
LTOFLAGS="-flto=thin"
RUSTFLAGS="-C opt-level=3 -C target-cpu=apple-m1 -C link-arg=-fuse-ld=lld"

# Parallel build across all P-cores and E-cores
MAKEFLAGS="-j$(nproc)"
NINJAFLAGS="-j$(nproc)"

# Debug flags (Disabled by default in OPTIONS to maintain < 2.8 GB footprint)
DEBUG_CFLAGS="-g0"
DEBUG_CXXFLAGS="-g0"
DEBUG_RUSTFLAGS="-C debuginfo=0"

# ------------------------------------------------------------------------------
# BUILD ENVIRONMENT & GLOBAL PACKAGE OPTIONS
# ------------------------------------------------------------------------------
BUILDENV=(!distcc color !ccache check !sign)
BUILDDIR=/tmp/makepkg-silicy

# Strip binaries aggressively, disable docs/libtool/staticlibs/debug packages
OPTIONS=(strip !docs !libtool !staticlibs emptydirs zipman purge !debug lto)

INTEGRITY_CHECK=(sha256)
STRIP_BINARIES="--strip-all"
STRIP_SHARED="--strip-unneeded"
STRIP_STATIC="--strip-debug"

MAN_DIRS=({usr{,/local}{,/share},opt/*}/{man,info})
DOC_DIRS=(usr/{,local/}{,share/}{doc,gtk-doc} opt/*/{doc,gtk-doc})
PURGE_TARGETS=(usr/{,share}/info/dir .packlist *.pod)
DBGSRCDIR="/usr/src/debug"

# ------------------------------------------------------------------------------
# PACKAGE OUTPUT & ZSTD ULTRA COMPRESSION
# ------------------------------------------------------------------------------
COMPRESSGZ=(gzip -c -f -n)
COMPRESSBZ2=(bzip2 -c -f)
COMPRESSXZ=(xz -c -z - --threads=0)
COMPRESSZST=(zstd -c -T0 --ultra -20 -)
COMPRESSLRZ=(lrzip -q)
COMPRESSLZO=(lzop -q)
COMPRESSZ=(compress -c -f)
COMPRESSLZ4=(lz4 -q)
COMPRESSLZ=(lzip -c -f)

PKGEXT='.pkg.tar.zst'
SRCEXT='.src.tar.gz'
