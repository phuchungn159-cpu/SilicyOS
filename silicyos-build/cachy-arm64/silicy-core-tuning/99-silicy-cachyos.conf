# ==============================================================================
# /etc/sysctl.d/99-silicy-cachyos.conf
# silicyOS Core Kernel Tuning (Apple Silicon 16KB Pages + ZRAM + BORE + BBRv3)
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. VIRTUAL MEMORY & 16KB PAGE ZRAM OPTIMIZATION
# ------------------------------------------------------------------------------
# Aggressive ZRAM swap utilization (zstd in-memory compression is orders of
# magnitude faster than NAND I/O; 150 maximizes anonymous page compression)
vm.swappiness = 150

# Retain dentries and inodes in RAM longer to speed up Btrfs metadata traversal
# and reduce Apple ANS2 NVMe wakeups
vm.vfs_cache_pressure = 50

# MANDATORY FOR 16KB PAGES + ZRAM: Disable swap readahead batching.
# Default page-cluster=3 reads 2^3 * 16KB = 128KB per fault, causing severe
# latency spikes in zram. Setting 0 decompresses strictly single 16KB pages.
vm.page-cluster = 0

# Bound writeback caches to prevent I/O stalls on Btrfs zstd:3 mounts
vm.dirty_ratio = 10
vm.dirty_background_ratio = 5
vm.dirty_writeback_centisecs = 1500
vm.dirty_expire_centisecs = 3000

# Page allocator & fragmentation tuning for 16KB Page Size
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
vm.compaction_proactiveness = 0
vm.extfrag_threshold = 100
vm.min_free_kbytes = 32768
vm.max_map_count = 1048576
vm.overcommit_memory = 1

# ------------------------------------------------------------------------------
# 2. CACHYOS BORE SCHEDULER (Burst-Oriented Response Enhancer)
# ------------------------------------------------------------------------------
# Enable BORE scheduler to prioritize interactive Wayland/PipeWire threads
# over background CPU-bound workloads on Apple Silicon P/E clusters
kernel.sched_bore = 1
kernel.sched_burst_cache_lifetime = 60000000
kernel.sched_burst_fork_atavistic = 2
kernel.sched_burst_penalty_offset = 22
kernel.sched_burst_penalty_scale = 1280
kernel.sched_burst_smoothness_long = 1
kernel.sched_burst_smoothness_short = 0
kernel.sched_autogroup_enabled = 1

# ------------------------------------------------------------------------------
# 3. NETWORKING: TCP BBRv3 + FQ + LOW-LATENCY SOCKET TUNING
# ------------------------------------------------------------------------------
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# Enable TCP Fast Open (TFO) for both client and server connections
net.ipv4.tcp_fastopen = 3

# Explicit Congestion Notification (ECN) & MTU probing for BBRv3
net.ipv4.tcp_ecn = 1
net.ipv4.tcp_ecn_fallback = 1
net.ipv4.tcp_mtu_probing = 1

# Reduce time-wait and keepalive overhead to conserve kernel slab RAM
net.ipv4.tcp_fin_timeout = 15
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_keepalive_time = 300
net.ipv4.tcp_keepalive_intvl = 30
net.ipv4.tcp_keepalive_probes = 5
net.ipv4.tcp_slow_start_after_idle = 0
net.ipv4.tcp_timestamps = 1
net.ipv4.tcp_sack = 1
net.ipv4.tcp_window_scaling = 1

# Balanced socket buffers (High throughput without bloating idle RAM)
net.core.netdev_max_backlog = 4096
net.core.somaxconn = 4096
net.core.rmem_default = 262144
net.core.wmem_default = 262144
net.core.rmem_max = 8388608
net.core.wmem_max = 8388608
net.ipv4.tcp_rmem = 16384 262144 8388608
net.ipv4.tcp_wmem = 16384 262144 8388608

# ------------------------------------------------------------------------------
# 4. KERNEL OVERHEAD, WATCHDOG & FILESYSTEM HANDLES
# ------------------------------------------------------------------------------
# Disable watchdogs to eliminate periodic timer interrupts on E-cores
kernel.nmi_watchdog = 0
kernel.soft_watchdog = 0
kernel.watchdog = 0

# Quiet kernel console log spam for sub-1.5s clean boot
kernel.printk = 3 3 3 3
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1
kernel.unprivileged_bpf_disabled = 1

# Inotify & file descriptors for responsive Wayland desktops
fs.file-max = 2097152
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 1024
