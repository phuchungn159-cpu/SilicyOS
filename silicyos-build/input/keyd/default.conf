# ==============================================================================
# /etc/keyd/default.conf (Mac Command Smart Sync Mode)
# silicyOS Apple Silicon Internal SPI/USB Keyboard & Magic Keyboard Remapper
# Preserves POSIX Ctrl+C inside Terminal (kitty) while enabling macOS Command
# shortcuts (Cmd+C/V/X/Z/A/W/T/Q) across GUI applications via keyd + app.conf.
# ==============================================================================

[ids]
*

[main]
# Keep Left/Right Command mapped to Meta (Super) layer so Wayland compositors
# and keyd-application-mapper distinguish physical Command from physical Ctrl.
leftmeta = layer(meta)
rightmeta = layer(meta)
leftcontrol = layer(control)
capslock = overload(control, esc)

[meta:M]
# Standard macOS Command shortcuts for GUI/Browser windows (overridden in kitty
# by ~/.config/keyd/app.conf and native kitty super+c/v bindings so Ctrl+C in
# kitty remains strictly POSIX SIGINT).
c = M-c
v = M-v
x = M-x
z = M-z
a = M-a
w = M-w
t = M-t
q = M-q
f = M-f
r = M-r
l = M-l
s = M-s
n = M-n
slash = M-slash
space = M-space
return = M-enter
