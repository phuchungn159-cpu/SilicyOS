# ==============================================================================
# /etc/keyd/default.conf - silicyOS Active Keyboard Profile (Apple Silicon)
# Default: Transparent Super (Mod) layer for vanilla Niri & Hyprland
# Swapped at runtime by silicy-ctl keyboard-mode <mac|pc>
# ==============================================================================

[ids]
*

[main]
leftmeta = layer(meta)
rightmeta = layer(meta)
leftcontrol = layer(control)
capslock = overload(control, esc)

[meta:M]
# Keep Command as true Super/Mod so vanilla Niri compositor bindings
# (Mod+T, Mod+D, Mod+Q, Mod+W, Mod+F, Mod+R, Mod+C, Mod+V, Mod+L, Mod+1..9)
# pass straight through to the compositor unmodified.
enter = M-enter
space = M-space
slash = M-slash
