# ==============================================================================
# /usr/share/silicyos/keyd/mac-mode.conf - Mac (Command) Mode Preset
# Default Apple Silicon layout with native Super/Mod pass-through for compositors
# Swapped to /etc/keyd/default.conf by silicy-ctl keyboard-mode mac
# ==============================================================================

[ids]
*

[main]
leftmeta = layer(meta)
rightmeta = layer(meta)
leftcontrol = layer(control)
capslock = overload(control, esc)

[meta:M]
# Keep Command as true Super/Mod so vanilla Niri compositor bindings
# pass straight through to the compositor without evdev interception.
enter = M-enter
space = M-space
slash = M-slash
