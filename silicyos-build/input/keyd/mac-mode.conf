# ==============================================================================
# /etc/keyd/mac-mode.conf — Apple HIG Native Command (⌘) Mode
# ==============================================================================

[ids]
*

[main]
leftmeta = layer(meta)
rightmeta = layer(meta)
leftcontrol = layer(control)
capslock = overload(control, esc)

[meta:M]
c = M-c
v = M-v
x = M-x
z = M-z
a = M-a
w = M-w
t = M-t
q = M-q
f = M-f
r = M-r
l = M-l
s = M-s
n = M-n
slash = M-slash
space = M-space
return = M-enter
