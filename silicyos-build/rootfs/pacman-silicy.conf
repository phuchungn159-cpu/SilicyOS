# /etc/pacman.conf - silicyOS Ultra-Compact ARM64 Configuration
# Architecture: aarch64 (Apple Silicon M1/M2/M3 - 16KB Page Size)

[options]
HoldPkg     = pacman glibc
Architecture = aarch64
Color
CheckSpace
VerbosePkgLists
ParallelDownloads = 8
ILoveCandy

SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# ==============================================================================
# ULTRA-COMPACT NOEXTRACT RULES (Target < 2.8GB Installed Rootfs)
# Note: Paths in Pacman NoExtract are relative to / (no leading slash)
# ==============================================================================

# 1. Block all documentation, manuals, info pages, and help files
NoExtract = usr/share/man/*
NoExtract = usr/share/doc/*
NoExtract = usr/share/info/*
NoExtract = usr/share/gtk-doc/*
NoExtract = usr/share/help/*

# 2. Block all locales EXCEPT en_US*, vi_VN*, and locale.alias
NoExtract = usr/share/locale/*
NoExtract = !usr/share/locale/en_US*
NoExtract = !usr/share/locale/en_US/*
NoExtract = !usr/share/locale/en_US/*/LC_MESSAGES/*
NoExtract = !usr/share/locale/vi_VN*
NoExtract = !usr/share/locale/vi_VN/*
NoExtract = !usr/share/locale/vi_VN/*/LC_MESSAGES/*
NoExtract = !usr/share/locale/locale.alias

# 3. Block redundant vendor firmware; ONLY retain brcm/*, apple/*, vendor/*, and regulatory.db* for Mac
NoExtract = usr/lib/firmware/*
NoExtract = usr/lib/firmware/amdgpu/*
NoExtract = usr/lib/firmware/nvidia/*
NoExtract = usr/lib/firmware/i915/*
NoExtract = usr/lib/firmware/iwlwifi*
NoExtract = usr/lib/firmware/mediatek/*
NoExtract = usr/lib/firmware/qcom/*
NoExtract = usr/lib/firmware/ath*
NoExtract = usr/lib/firmware/rtlwifi/*
NoExtract = usr/lib/firmware/mrvl/*
NoExtract = usr/lib/firmware/netronome/*
NoExtract = !usr/lib/firmware/brcm/*
NoExtract = !usr/lib/firmware/brcm/**
NoExtract = !usr/lib/firmware/apple/*
NoExtract = !usr/lib/firmware/apple/**
NoExtract = !usr/lib/firmware/vendor
NoExtract = !usr/lib/firmware/vendor/*
NoExtract = !usr/lib/firmware/vendor/**
NoExtract = !usr/lib/firmware/regulatory.db*
NoExtract = !usr/lib/asahi-boot/*
NoExtract = !usr/lib/asahi-boot/**

# ==============================================================================
# REPOSITORIES (Asahi ALARM prioritized over upstream Arch Linux ARM)
# ==============================================================================

#[silicy-local]
#SigLevel = Optional TrustAll
#Server = file:///var/cache/silicy-repo

[asahi-alarm]
Include = /etc/pacman.d/mirrorlist.asahi-alarm

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[alarm]
Include = /etc/pacman.d/mirrorlist

[aur]
Include = /etc/pacman.d/mirrorlist
